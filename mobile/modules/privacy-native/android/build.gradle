plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.privacyscanner'
version = '1.0.0'

expoModule {
  v2 true
}

android {
  namespace "expo.modules.privacynative"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // Decode one frame from an open RTSP camera for the "what this camera sees" view
  implementation "androidx.media3:media3-exoplayer:1.9.1"
  implementation "androidx.media3:media3-exoplayer-rtsp:1.9.1"
}
